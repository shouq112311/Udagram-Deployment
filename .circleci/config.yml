version: 2.1

# CircleCI orbs for AWS CLI and browser tools.
orbs:
  aws-cli: circleci/aws-cli@3.1.1
  browser-tools: circleci/browser-tools@1.4.8

jobs:
  # Install, test, and build the legacy Angular frontend.
  frontend-build:
    docker:
      - image: cimg/node:16.20-browsers
    steps:
      - checkout
      - browser-tools/install-chrome
      - run:
          name: Install Frontend Dependencies
          command: npm run frontend:install
      - run:
          name: Run Frontend Tests
          command: |
            cd udagram/udagram-frontend
            npm run test -- --browsers=ChromeHeadless
      - run:
          name: Build Frontend
          command: npm run frontend:build

      # Share frontend build artifacts with the deployment job.
      - persist_to_workspace:
          root: .
          paths:
            - udagram/udagram-frontend/www

  # Install, build, and test the backend using Node.js 22.
  backend-build:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install API Dependencies
          command: npm run api:install
      - run:
          name: Build API
          command: npm run api:build
      - run:
          name: Run Backend Tests
          command: |
            cd udagram/udagram-api
            npm test

      # Share backend build artifacts with the deployment job.
      - persist_to_workspace:
          root: .
          paths:
            - udagram/udagram-api/www

  # Validate AWS credentials before deploying.
  aws-check:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - aws-cli/install
      - run:
          name: Verify AWS Credentials
          command: aws sts get-caller-identity

  # Deploy the compiled frontend to Amazon S3.
  frontend-deploy:
    docker:
      - image: cimg/node:16.20
    steps:
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/install
      - run:
          name: Deploy Frontend to AWS S3
          command: npm run frontend:deploy

  # Package and deploy the backend to Elastic Beanstalk.
  backend-deploy:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/install
      - run:
          name: Install Elastic Beanstalk CLI
          command: |
            python -m venv /tmp/ebcli
            /tmp/ebcli/bin/pip install awsebcli
            sudo apt-get update
            sudo apt-get install -y zip

      # Pass protected CircleCI variables to the production environment.
      - run:
          name: Configure Production Environment Variables
          command: |
            set +x

            : "${AWS_BUCKET:?Missing AWS_BUCKET}"
            : "${AWS_REGION:?Missing AWS_REGION}"
            : "${PORT:?Missing PORT}"
            : "${POSTGRES_DB:?Missing POSTGRES_DB}"
            : "${POSTGRES_HOST:?Missing POSTGRES_HOST}"
            : "${POSTGRES_USERNAME:?Missing POSTGRES_USERNAME}"
            : "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}"
            : "${JWT_SECRET:?Missing JWT_SECRET}"
            : "${URL:?Missing URL}"

            cd udagram/udagram-api

            /tmp/ebcli/bin/eb setenv \
              AWS_BUCKET="$AWS_BUCKET" \
              AWS_REGION="$AWS_REGION" \
              PORT="$PORT" \
              POSTGRES_DB="$POSTGRES_DB" \
              POSTGRES_HOST="$POSTGRES_HOST" \
              POSTGRES_USERNAME="$POSTGRES_USERNAME" \
              POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              JWT_SECRET="$JWT_SECRET" \
              URL="$URL" \
              --environment Udagram-api-env

      # Deploy the compiled backend application.
      - run:
          name: Deploy Backend to Elastic Beanstalk
          command: |
            cd udagram/udagram-api
            cd www
            zip -r ../udagram-api.zip .
            cd ..
            /tmp/ebcli/bin/eb deploy Udagram-api-env

# Build and test both applications in parallel.
# Deploy only after successful builds and AWS verification.
# Production deployment is restricted to the main branch.
workflows:
  udagram:
    jobs:
      - frontend-build
      - backend-build
      - aws-check:
          requires:
            - frontend-build
            - backend-build
          filters:
            branches:
              only: main
      - frontend-deploy:
          requires:
            - aws-check
          filters:
            branches:
              only: main
      - backend-deploy:
          requires:
            - aws-check
          filters:
            branches:
              only: main