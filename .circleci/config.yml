version: 2.1

orbs:
  aws-cli: circleci/aws-cli@3.1.1

jobs:
  frontend-build:
    docker:
      - image: cimg/node:16.20
    steps:
      - checkout
      - run:
          name: Install Frontend Dependencies
          command: npm run frontend:install
      - run:
          name: Build Frontend
          command: npm run frontend:build
      - persist_to_workspace:
          root: .
          paths:
            - udagram/udagram-frontend/www

  backend-build:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install API Dependencies
          command: npm run api:install
      - run:
          name: Build API
          command: npm run api:build
      - persist_to_workspace:
          root: .
          paths:
            - udagram/udagram-api/www

  aws-check:
    docker:
      - image: cimg/base:stable
    steps:
      - aws-cli/install
      - run:
          name: Verify AWS Credentials
          command: aws sts get-caller-identity

  frontend-deploy:
    docker:
      - image: cimg/node:16.20
    steps:
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/install
      - run:
          name: Deploy Frontend to AWS S3
          command: npm run frontend:deploy

workflows:
  udagram:
    jobs:
      - frontend-build
      - backend-build
      - aws-check:
          requires:
            - frontend-build
            - backend-build
          filters:
            branches:
              only: main
      - frontend-deploy:
          requires:
            - aws-check
          filters:
            branches:
              only: main