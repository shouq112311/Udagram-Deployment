version: 2.1

orbs:
  aws-cli: circleci/aws-cli@3.1.1
  browser-tools: circleci/browser-tools@1.4.8

jobs:
  frontend-build:
    docker:
      - image: cimg/node:16.20-browsers
    steps:
      - checkout
      - browser-tools/install-chrome
      - run:
          name: Install Frontend Dependencies
          command: npm run frontend:install
      - run:
          name: Run Frontend Tests
          command: |
            cd udagram/udagram-frontend
            npm run test -- --browsers=ChromeHeadless
      - run:
          name: Build Frontend
          command: npm run frontend:build
      - persist_to_workspace:
          root: .
          paths:
            - udagram/udagram-frontend/www

  backend-build:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install API Dependencies
          command: npm run api:install
      - run:
          name: Build API
          command: npm run api:build
      - run:
          name: Run Backend Tests
          command: |
            cd udagram/udagram-api
            npm test
      - persist_to_workspace:
          root: .
          paths:
            - udagram/udagram-api/www

  aws-check:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - aws-cli/install
      - run:
          name: Verify AWS Credentials
          command: aws sts get-caller-identity

  frontend-deploy:
    docker:
      - image: cimg/node:16.20
    steps:
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/install
      - run:
          name: Deploy Frontend to AWS S3
          command: npm run frontend:deploy

  backend-deploy:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/install
      - run:
          name: Install Elastic Beanstalk CLI
          command: |
            python -m venv /tmp/ebcli
            /tmp/ebcli/bin/pip install awsebcli
            sudo apt-get update
            sudo apt-get install -y zip
      - run:
          name: Deploy Backend to Elastic Beanstalk
          command: |
            cd udagram/udagram-api
            cd www
            zip -r ../udagram-api.zip .
            cd ..
            /tmp/ebcli/bin/eb deploy Udagram-api-env

workflows:
  udagram:
    jobs:
      - frontend-build
      - backend-build
      - aws-check:
          requires:
            - frontend-build
            - backend-build
          filters:
            branches:
              only: main
      - frontend-deploy:
          requires:
            - aws-check
          filters:
            branches:
              only: main
      - backend-deploy:
          requires:
            - aws-check
          filters:
            branches:
              only: main